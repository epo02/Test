<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spider-Kid Runner</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Arial Black', Arial, sans-serif;
    overflow: hidden;
  }
  h1 {
    color: #e63946;
    font-size: 2.2rem;
    margin-bottom: 12px;
    text-shadow: 0 0 20px #e63946aa;
    letter-spacing: 2px;
  }
  #gameCanvas {
    border: 3px solid #e63946;
    border-radius: 10px;
    box-shadow: 0 0 40px #e6394688;
    cursor: pointer;
  }
  #ui {
    display: flex;
    justify-content: space-between;
    width: 800px;
    margin-top: 12px;
    color: #fff;
    font-size: 1rem;
  }
  #instructions {
    color: #aaa;
    font-size: 0.85rem;
    margin-top: 8px;
  }
  .score-label { color: #e63946; font-weight: bold; }
</style>
</head>
<body>
<h1>SPIDER-KID RUNNER</h1>
<canvas id="gameCanvas" width="800" height="350"></canvas>
<div id="ui">
  <div><span class="score-label">SCORE: </span><span id="scoreDisplay">0</span></div>
  <div><span class="score-label">BEST: </span><span id="bestDisplay">0</span></div>
  <div><span class="score-label">SPEED: </span><span id="speedDisplay">1x</span></div>
</div>
<div id="instructions">SPACE / CLICK / TAP to jump &nbsp;|&nbsp; Double-jump allowed!</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const W = canvas.width;
const H = canvas.height;
const GROUND = H - 60;

// ── Game state ──────────────────────────────────────────────
let state = 'idle'; // idle | running | dead
let score = 0;
let best = 0;
let frame = 0;
let speed = 4;
let spawnTimer = 0;
let spawnInterval = 90;
let animFrame = null;

// ── Player ───────────────────────────────────────────────────
const player = {
  x: 100, y: GROUND,
  w: 44, h: 64,
  vy: 0,
  jumps: 0,        // 0=none, 1=single, 2=double
  maxJumps: 2,
  onGround: true,
  legPhase: 0,
  armPhase: 0,
};

const GRAVITY = 0.6;
const JUMP_FORCE = -13;

// ── Obstacles ────────────────────────────────────────────────
let obstacles = [];

// ── Background layers ────────────────────────────────────────
const bgBuildings = [];
for (let i = 0; i < 8; i++) {
  bgBuildings.push({
    x: Math.random() * W,
    w: 40 + Math.random() * 60,
    h: 60 + Math.random() * 100,
    speed: 0.5,
    color: `hsl(220,30%,${12 + Math.random() * 10}%)`
  });
}

const stars = [];
for (let i = 0; i < 60; i++) {
  stars.push({ x: Math.random() * W, y: Math.random() * (GROUND - 80), r: Math.random() * 1.5 + 0.3, twinkle: Math.random() * Math.PI * 2 });
}

// ── Web particles ─────────────────────────────────────────────
let webParticles = [];

// ── Input ─────────────────────────────────────────────────────
function doJump() {
  if (state === 'idle' || state === 'dead') {
    startGame();
    return;
  }
  if (player.jumps < player.maxJumps) {
    player.vy = JUMP_FORCE;
    player.jumps++;
    player.onGround = false;
    // Shoot web effect
    for (let i = 0; i < 6; i++) {
      webParticles.push({
        x: player.x + player.w / 2,
        y: player.y,
        vx: (Math.random() - 0.3) * 4,
        vy: Math.random() * -3 - 1,
        life: 1,
        len: 10 + Math.random() * 20,
      });
    }
  }
}

document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); doJump(); } });
canvas.addEventListener('click', doJump);
canvas.addEventListener('touchstart', e => { e.preventDefault(); doJump(); }, { passive: false });

// ── Game lifecycle ─────────────────────────────────────────────
function startGame() {
  score = 0;
  speed = 4;
  spawnTimer = 0;
  spawnInterval = 90;
  obstacles = [];
  webParticles = [];
  player.y = GROUND;
  player.vy = 0;
  player.jumps = 0;
  player.onGround = true;
  state = 'running';
}

function gameOver() {
  state = 'dead';
  if (score > best) best = score;
  document.getElementById('bestDisplay').textContent = best;
}

// ── Obstacle types ─────────────────────────────────────────────
function spawnObstacle() {
  const types = ['barrel', 'spike', 'tall', 'double'];
  const t = types[Math.floor(Math.random() * types.length)];
  if (t === 'barrel') {
    obstacles.push({ x: W + 20, y: GROUND, w: 36, h: 36, type: 'barrel' });
  } else if (t === 'spike') {
    obstacles.push({ x: W + 20, y: GROUND, w: 20, h: 44, type: 'spike' });
  } else if (t === 'tall') {
    obstacles.push({ x: W + 20, y: GROUND, w: 28, h: 70, type: 'tall' });
  } else {
    obstacles.push({ x: W + 20, y: GROUND, w: 30, h: 40, type: 'barrel' });
    obstacles.push({ x: W + 70, y: GROUND, w: 30, h: 40, type: 'barrel' });
  }
}

// ── Drawing helpers ────────────────────────────────────────────
function drawStar(x, y, r, twinkle, t) {
  const alpha = 0.5 + 0.5 * Math.sin(twinkle + t * 0.03);
  ctx.fillStyle = `rgba(255,255,255,${alpha})`;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}

function drawBuilding(b) {
  ctx.fillStyle = b.color;
  ctx.fillRect(b.x, GROUND - b.h, b.w, b.h);
  // windows
  ctx.fillStyle = 'rgba(255,220,100,0.18)';
  for (let row = 0; row < Math.floor(b.h / 18); row++) {
    for (let col = 0; col < Math.floor(b.w / 14); col++) {
      if (Math.sin(b.x + row * 7 + col * 13) > 0.1) {
        ctx.fillRect(b.x + 4 + col * 14, GROUND - b.h + 6 + row * 18, 7, 8);
      }
    }
  }
}

function drawBarrel(obs) {
  const x = obs.x, y = obs.y - obs.h, w = obs.w, h = obs.h;
  const cx = x + w / 2, cy = y + h / 2;
  // body
  ctx.fillStyle = '#8B4513';
  ctx.beginPath();
  ctx.ellipse(cx, cy, w / 2, h / 2, 0, 0, Math.PI * 2);
  ctx.fill();
  // bands
  ctx.strokeStyle = '#5c2d00';
  ctx.lineWidth = 3;
  for (let band = -0.3; band <= 0.3; band += 0.3) {
    ctx.beginPath();
    ctx.ellipse(cx, cy + band * h, w / 2, h * 0.12, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
  // shine
  ctx.fillStyle = 'rgba(255,200,100,0.2)';
  ctx.beginPath();
  ctx.ellipse(cx - w * 0.15, cy - h * 0.15, w * 0.15, h * 0.2, -0.5, 0, Math.PI * 2);
  ctx.fill();
}

function drawSpike(obs) {
  const x = obs.x, y = obs.y - obs.h, w = obs.w, h = obs.h;
  ctx.fillStyle = '#888';
  ctx.beginPath();
  ctx.moveTo(x, obs.y);
  ctx.lineTo(x + w / 2, y);
  ctx.lineTo(x + w, obs.y);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#bbb';
  ctx.beginPath();
  ctx.moveTo(x + w * 0.1, obs.y);
  ctx.lineTo(x + w / 2, y);
  ctx.lineTo(x + w * 0.3, obs.y);
  ctx.closePath();
  ctx.fill();
}

// ── Draw Spider-Kid character ──────────────────────────────────
function drawSpiderKid(p, t) {
  const x = p.x;
  const y = p.y; // feet y
  const running = p.onGround;
  const legSwing = running ? Math.sin(p.legPhase) * 14 : 0;
  const armSwing = running ? Math.sin(p.armPhase) * 10 : (p.jumps > 0 ? -25 : 0);

  // ── Shadow ──────────────────────────────────────────────────
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(x + p.w / 2, y + 2, p.w / 2, 6, 0, 0, Math.PI * 2);
  ctx.fill();

  const cx = x + p.w / 2;

  // ── Legs ────────────────────────────────────────────────────
  // Left leg
  ctx.strokeStyle = '#cc0000';
  ctx.lineWidth = 8;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - 6, y - 20);
  ctx.lineTo(cx - 10 + legSwing * 0.5, y);
  ctx.stroke();
  // Left shoe
  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.ellipse(cx - 10 + legSwing * 0.5, y, 9, 5, 0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.ellipse(cx - 7 + legSwing * 0.5, y - 1, 4, 2.5, 0.3, 0, Math.PI * 2);
  ctx.fill();

  // Right leg
  ctx.strokeStyle = '#cc0000';
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.moveTo(cx + 6, y - 20);
  ctx.lineTo(cx + 10 - legSwing * 0.5, y);
  ctx.stroke();
  // Right shoe
  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.ellipse(cx + 10 - legSwing * 0.5, y, 9, 5, -0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.ellipse(cx + 7 - legSwing * 0.5, y - 1, 4, 2.5, -0.3, 0, Math.PI * 2);
  ctx.fill();

  // ── Body (Spider-Man suit) ───────────────────────────────────
  // Main body - red
  ctx.fillStyle = '#cc0000';
  ctx.beginPath();
  ctx.roundRect(cx - 14, y - 52, 28, 34, 6);
  ctx.fill();

  // Blue panels on sides
  ctx.fillStyle = '#1a3fa8';
  ctx.beginPath();
  ctx.roundRect(cx - 14, y - 52, 7, 34, [6, 0, 0, 6]);
  ctx.fill();
  ctx.beginPath();
  ctx.roundRect(cx + 7, y - 52, 7, 34, [0, 6, 6, 0]);
  ctx.fill();

  // Web lines on body
  ctx.strokeStyle = 'rgba(0,0,0,0.35)';
  ctx.lineWidth = 1;
  for (let row = 0; row < 4; row++) {
    ctx.beginPath();
    ctx.moveTo(cx - 13, y - 50 + row * 9);
    ctx.lineTo(cx + 13, y - 50 + row * 9);
    ctx.stroke();
  }
  for (let col = -3; col <= 3; col++) {
    ctx.beginPath();
    ctx.moveTo(cx + col * 4.5, y - 52);
    ctx.lineTo(cx + col * 4.5, y - 18);
    ctx.stroke();
  }

  // Spider logo on chest
  ctx.fillStyle = '#111';
  // spider body
  ctx.beginPath();
  ctx.ellipse(cx, y - 38, 6, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cx, y - 30, 5, 3.5, 0, 0, Math.PI * 2);
  ctx.fill();
  // spider legs (4 each side)
  ctx.strokeStyle = '#111';
  ctx.lineWidth = 1.2;
  const spiderLegs = [[-8,-42],[8,-42],[-10,-37],[10,-37],[-9,-31],[9,-31],[-7,-26],[7,-26]];
  spiderLegs.forEach(([lx, ly], i) => {
    const sign = i % 2 === 0 ? -1 : 1;
    ctx.beginPath();
    ctx.moveTo(cx + sign * 4, ly);
    ctx.quadraticCurveTo(cx + lx * 0.6, ly - 3, cx + lx, ly - 5);
    ctx.stroke();
  });

  // ── Arms ────────────────────────────────────────────────────
  // Left arm
  ctx.strokeStyle = '#cc0000';
  ctx.lineWidth = 7;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - 12, y - 47);
  ctx.quadraticCurveTo(cx - 22, y - 42 + armSwing, cx - 24, y - 36 + armSwing * 0.8);
  ctx.stroke();
  // Left glove (blue)
  ctx.fillStyle = '#1a3fa8';
  ctx.beginPath();
  ctx.arc(cx - 24, y - 34 + armSwing * 0.8, 5, 0, Math.PI * 2);
  ctx.fill();

  // Right arm
  ctx.strokeStyle = '#cc0000';
  ctx.lineWidth = 7;
  ctx.beginPath();
  ctx.moveTo(cx + 12, y - 47);
  ctx.quadraticCurveTo(cx + 22, y - 42 - armSwing, cx + 24, y - 36 - armSwing * 0.8);
  ctx.stroke();
  // Right glove (blue)
  ctx.fillStyle = '#1a3fa8';
  ctx.beginPath();
  ctx.arc(cx + 24, y - 34 - armSwing * 0.8, 5, 0, Math.PI * 2);
  ctx.fill();

  // ── Head ────────────────────────────────────────────────────
  // Neck
  ctx.fillStyle = '#d4956a';
  ctx.fillRect(cx - 5, y - 57, 10, 7);

  // Head base (skin - peeking out from mask)
  ctx.fillStyle = '#d4956a';
  ctx.beginPath();
  ctx.arc(cx, y - 66, 16, 0, Math.PI * 2);
  ctx.fill();

  // Spider-Man mask (red + blue top)
  ctx.fillStyle = '#cc0000';
  ctx.beginPath();
  ctx.arc(cx, y - 66, 16, Math.PI, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx, y - 66, 16, -Math.PI * 0.9, -Math.PI * 0.1);
  ctx.fill();

  // Hair showing at top (dark)
  ctx.fillStyle = '#2a1a0a';
  ctx.beginPath();
  ctx.arc(cx, y - 73, 10, Math.PI, Math.PI * 2);
  ctx.fill();
  // Hair tuft
  ctx.beginPath();
  ctx.arc(cx - 5, y - 80, 5, Math.PI, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx + 3, y - 81, 5, Math.PI, Math.PI * 2);
  ctx.fill();

  // Mask eye whites
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.ellipse(cx - 6, y - 63, 6, 4.5, -0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cx + 6, y - 63, 6, 4.5, 0.3, 0, Math.PI * 2);
  ctx.fill();

  // Eye outline (black)
  ctx.strokeStyle = '#111';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.ellipse(cx - 6, y - 63, 6, 4.5, -0.3, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(cx + 6, y - 63, 6, 4.5, 0.3, 0, Math.PI * 2);
  ctx.stroke();

  // Smile (peeking below mask)
  ctx.strokeStyle = '#c06040';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(cx, y - 58, 5, 0.1, Math.PI - 0.1);
  ctx.stroke();

  // Cheek rosy
  ctx.fillStyle = 'rgba(220,120,100,0.3)';
  ctx.beginPath();
  ctx.arc(cx - 11, y - 57, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx + 11, y - 57, 4, 0, Math.PI * 2);
  ctx.fill();
}

// ── Draw web particles ─────────────────────────────────────────
function drawWebParticles() {
  webParticles.forEach(p => {
    ctx.strokeStyle = `rgba(200,200,200,${p.life * 0.7})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x - p.vx * p.len * 0.5, p.y - p.vy * p.len * 0.5);
    ctx.stroke();
  });
}

// ── Draw ground ────────────────────────────────────────────────
function drawGround(offset) {
  // Sidewalk/road
  ctx.fillStyle = '#2a2a3a';
  ctx.fillRect(0, GROUND, W, H - GROUND);

  // Road markings
  ctx.fillStyle = '#ffcc00';
  ctx.fillRect(0, GROUND + 1, W, 3);
  for (let i = 0; i < W + 80; i += 80) {
    const lx = ((i - offset * 3) % (W + 80) + W + 80) % (W + 80) - 40;
    ctx.fillStyle = '#555';
    ctx.fillRect(lx, GROUND + 18, 50, 5);
  }

  // Curb highlight
  ctx.fillStyle = '#444';
  ctx.fillRect(0, GROUND + 5, W, 6);
}

// ── Collision ──────────────────────────────────────────────────
function checkCollision(obs) {
  const px = player.x + 6;
  const pw = player.w - 12;
  const ph = player.h;
  const py = player.y - ph;

  const ox = obs.x + 4;
  const ow = obs.w - 8;
  const oh = obs.h;
  const oy = obs.y - oh;

  return px < ox + ow && px + pw > ox && py < oy + oh && py + ph > oy;
}

// ── Main loop ──────────────────────────────────────────────────
let bgOffset = 0;

function update() {
  if (state !== 'running') return;

  frame++;
  score++;
  bgOffset += speed * 0.5;

  // Speed ramp
  speed = 4 + Math.floor(score / 300) * 0.5;
  spawnInterval = Math.max(45, 90 - Math.floor(score / 200) * 5);
  document.getElementById('scoreDisplay').textContent = score;
  document.getElementById('speedDisplay').textContent = (speed / 4).toFixed(1) + 'x';

  // Physics
  player.vy += GRAVITY;
  player.y += player.vy;
  if (player.y >= GROUND) {
    player.y = GROUND;
    player.vy = 0;
    player.jumps = 0;
    player.onGround = true;
  } else {
    player.onGround = false;
  }

  // Animate
  if (player.onGround) {
    player.legPhase += 0.22;
    player.armPhase += 0.22;
  }

  // Spawn obstacles
  spawnTimer++;
  if (spawnTimer >= spawnInterval) {
    spawnTimer = 0;
    spawnObstacle();
  }

  // Move obstacles
  obstacles.forEach(o => o.x -= speed);
  obstacles = obstacles.filter(o => o.x > -80);

  // Collision
  if (obstacles.some(checkCollision)) {
    gameOver();
  }

  // Web particles
  webParticles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.1;
    p.life -= 0.05;
  });
  webParticles = webParticles.filter(p => p.life > 0);

  // Background buildings scroll
  bgBuildings.forEach(b => {
    b.x -= b.speed;
    if (b.x + b.w < 0) {
      b.x = W + Math.random() * 50;
      b.h = 60 + Math.random() * 100;
      b.w = 40 + Math.random() * 60;
    }
  });
}

function draw() {
  // Sky gradient
  const sky = ctx.createLinearGradient(0, 0, 0, GROUND);
  sky.addColorStop(0, '#0a0a1a');
  sky.addColorStop(1, '#1a1a3a');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, GROUND);

  // Stars
  stars.forEach(s => drawStar(s.x, s.y, s.r, s.twinkle, frame));

  // Background buildings
  bgBuildings.forEach(drawBuilding);

  // Ground
  drawGround(bgOffset);

  // Web particles
  drawWebParticles();

  // Obstacles
  obstacles.forEach(obs => {
    if (obs.type === 'barrel') drawBarrel(obs);
    else drawSpike(obs);
  });

  // Player
  drawSpiderKid(player, frame);

  // HUD overlays
  if (state === 'idle') {
    drawOverlay('SPIDER-KID RUNNER', 'Press SPACE / Tap to Start!', '#e63946');
  } else if (state === 'dead') {
    drawOverlay('GAME OVER', `Score: ${score}   Best: ${best}\n\nPress SPACE / Tap to Retry!`, '#e63946');
  }

  // Score popup on milestone
  if (state === 'running' && score % 500 === 0 && score > 0) {
    ctx.fillStyle = 'rgba(255,204,0,0.85)';
    ctx.font = 'bold 22px Arial Black';
    ctx.textAlign = 'center';
    ctx.fillText(`${score} POINTS!`, W / 2, 80);
  }
}

function drawOverlay(title, subtitle, color) {
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = color;
  ctx.font = 'bold 48px Arial Black';
  ctx.textAlign = 'center';
  ctx.fillText(title, W / 2, H / 2 - 30);

  ctx.fillStyle = '#fff';
  ctx.font = '20px Arial';
  const lines = subtitle.split('\n');
  lines.forEach((line, i) => {
    ctx.fillText(line, W / 2, H / 2 + 20 + i * 28);
  });
  ctx.textAlign = 'left';
}

function loop() {
  update();
  draw();
  animFrame = requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
